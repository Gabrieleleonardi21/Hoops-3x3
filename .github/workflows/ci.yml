# Integrazione continua del frontend: lint, controllo dei tipi, test con copertura, build e test end-to-end.
# Gira a ogni push su main e a ogni pull request, anche quelle che puntano a un altro ramo (pull request in serie).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il token del workflow legge il repository e basta: nessun job scrive su GitHub
permissions:
  contents: read

# Un solo giro per ramo: un push nuovo sulla stessa pull request ferma quello in corso, che non servirebbe più
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      # Chromium dalla cache quando la versione di Playwright è la stessa: scaricarlo ogni volta è il passo più lento del job.
      # Le librerie di sistema servono comunque (install-deps), il browser solo se la cache manca
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Sul server di anteprima della build (vite preview), con la Content-Security-Policy di produzione (playwright.config.ts)
      - run: npm run test:e2e

  # Percorsi da registrato con il backend vero (tests/e2e-backend/, playwright.backend.config.ts): il jar si compila dal ramo main del
  # repository hoop3x3-backend e gira contro un PostgreSQL di servizio. Se il backend cambia un contratto che questi test fissano
  # (201 alle creazioni, versione 0 della tappa nuova), la PR si ferma qui
  e2e-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hoop3x3_e2e
          POSTGRES_USER: hoop
          POSTGRES_PASSWORD: hoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoop -d hoop3x3_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Gabrieleleonardi21/hoop3x3-backend
          path: backend
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Il backend ha la sua CI con i test: qui serve solo il jar
      - run: ./mvnw -B package -DskipTests
        working-directory: backend
      - run: echo "E2E_BACKEND_JAR=$(ls "$GITHUB_WORKSPACE"/backend/target/hoop-3x3-backend-*.jar)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La stessa cache di Chromium del job frontend
      - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e:backend
        env:
          E2E_DB_NAME: hoop3x3_e2e
          E2E_DB_USERNAME: hoop
          E2E_DB_PASSWORD: hoop

# Integrazione continua del frontend: lint, controllo dei tipi, test con copertura, build e test end-to-end.
# Gira a ogni push su main e a ogni pull request, anche quelle che puntano a un altro ramo (pull request in serie).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      # Solo Chromium, con le librerie di sistema che gli servono sul runner
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
